apiVersion: apps/v1
kind: Deployment
metadata:
  name: selenoid-ui
spec:
  replicas: 1 # numbers of pod copies
  selector:
    matchLabels:
      app: selenoid-ui # linking Deployment and Pod
  template:
    metadata:
      labels:
        app: selenoid-ui # setup label on the pod
    spec:
      containers:
        - name: selenoid-ui
          image: aerokube/selenoid-ui:latest
          args: [ "--selenoid-uri", "http://selenoid:4444" ]
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: selenoid-ui
spec:
  selector:
    app: selenoid-ui #сервис будет напрвлять трафик на под у которых app = selenoid-ui
  ports:
    - protocol: TCP
      port: 8080 # порт на сервиса
      targetPort: 8080 # порт на которыыи нужно пересылать
  type: NodePort # ClusterIP (он доступен только внутри кластера), NodePort (открывает порт на всех нодах кластера)
