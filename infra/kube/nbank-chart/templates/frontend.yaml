apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1 # numbers of pod copies
  selector:
    matchLabels:
      app: frontend # linking Deployment and Pod
  template:
    metadata:
      labels:
        app: frontend # setup label on the pod
    spec:
      containers:
        - name: frontend
          image: nobugsme/nbank-ui:with_nginx
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend #сервис будет напрвлять трафик на под у которых app = frontend
  ports:
    - protocol: TCP
      port: 80 # порт на сервиса
      targetPort: 80 # порт на которыыи нужно пересылать
