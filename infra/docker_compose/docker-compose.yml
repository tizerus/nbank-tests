services:
  backend:
    image: nobugsme/nbank:with_database_with_fix_with_swagger
    ports:
      - "4111:4111"
    networks:
      - nbank-network
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/nbank
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
    depends_on:
      postgres:
        condition: service_healthy  # Ждем пока PostgreSQL станет здоровым, медленно поднимается в Github Actions
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4111/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s  # Даем бэкенду 60 секунд на старт

  postgres:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=nbank
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # - ./init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - nbank-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d nbank" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s  # Даем PostgreSQL больше времени на инициализацию

  frontend:
    image: nobugsme/nbank-ui:latest
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nbank-network
    healthcheck:
      test: ["CMD-SHELL", "cat /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - nbank-network

  selenoid:
    image: aerokube/selenoid:latest
    ports:
      - "4444:4444"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/:/etc/selenoid/:ro
    command: ["-container-network", "nbank-network"]
    depends_on:
      - frontend
    networks:
      - nbank-network

  selenoid-ui:
    image: aerokube/selenoid-ui:latest
    ports:
      - "6557:8080"
    command: ["--selenoid-uri", "http://selenoid:4444"]
    depends_on:
      - selenoid
    networks:
      - nbank-network
networks:
  nbank-network:
    name: nbank-network

volumes:
  postgres_data:
    driver: local
