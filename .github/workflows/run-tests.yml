name: Run tests

#trigger
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'src/**'
  workflow_dispatch:

jobs:
  run-tests:
    name: Setup services (review apps) and run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository # copy repossitory files into agent runner
        uses: actions/checkout@v6.0.2

      - name: Setup JDK
        uses: actions/setup-java@v5.2.0
        with:
          distribution: "corretto"
          java-version: "21"

      - name: Setup Maven 3.9.11
        uses: stCarolas/setup-maven@v5.1
        with:
          maven-version: 3.9.11

      - name: Install jq and curl
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Cache maven repo
        uses: actions/cache@v5.0.5
        with:
          path: ~/m2/repository
          key: ${{runner.os}}-maven-${{hashFiles('**.pom.xml')}}
          restore-keys: |
            ${{runner.os}}-maven-

      - name: Setup services
        run: |
          pwd
          cd ./infra/docker_compose
          pwd
          ls init-scripts
          chmod +x ./restart_docker_compose.sh
          chmod -R 755 init-scripts
          ./restart_docker_compose.sh
          
          # Если бэкенд упал, показываем логи
          if ! docker ps | grep -q backend; then
          echo "=== Backend logs ==="
          docker compose logs backend
          echo "=== PostgreSQL logs ==="
          docker compose logs postgres
          exit 1
          fi

      - name: Check nginx
        run: |
          echo "=== Check running containers ==="
          docker ps

          echo "=== Check nginx logs ==="
          docker logs docker_compose-nginx-1 --tail 50

          echo "=== Test nginx directly ==="
          curl -v http://localhost:80
          curl -v http://localhost:80/api/v1/  # если есть API endpoint

          echo "=== Check nginx config ==="
          docker exec docker_compose-nginx-1 cat /etc/nginx/nginx.conf

          echo "=== Check that frontend is reachable from nginx ==="
          docker exec docker_compose-nginx-1 curl -v http://frontend:3000 || echo "Cannot reach frontend"
          docker exec docker_compose-nginx-1 curl -v http://backend:4111 || echo "Cannot reach backend"
      - name: Debug Selenoid after startup
        run: |
          echo "=== Selenoid status API ==="
          curl -s http://localhost:4444/status | jq '.' || curl -s http://localhost:4444/status
    
          echo -e "\n=== Selenoid logs ==="
          docker logs docker_compose-selenoid-1 --tail 50
    
          echo -e "\n=== Check if browsers.json is mounted correctly ==="
          docker exec docker_compose-selenoid-1 ls -la /etc/selenoid/
          docker exec docker_compose-selenoid-1 cat /etc/selenoid/browsers.json 2>/dev/null || echo "browsers.json not found"
    
          echo -e "\n=== Check available browser versions ==="
          curl -s http://localhost:4444/status | grep -o '"chrome":{[^}]*}' || echo "Chrome not found in status"

      - name: Run Api tests
        run: mvn clean test -q -P api -Dsurefire.rerunFailingTestsCount=3
        env:
          BASE_API_URL: "http://localhost:4111"

      - name: Run UI tests
        run: mvn test -q -P ui -DskipCheckstyle=true -Dsurefire.rerunFailingTestsCount=3
        env:
          BASE_UI_URL: "http://nginx:80"
          BASE_API_URL: "http://localhost:4111"
          REMOTE: "http://localhost:4444/wd/hub"

      - name: Run swagger coverage
        if: always()
        run: |
          chmod +x .swagger-coverage-commandline/bin/swagger-coverage-commandline

          .swagger-coverage-commandline/bin/swagger-coverage-commandline \
            -s http://localhost:4111/v3/api-docs \
            -i swagger-coverage-output

      - name: Upload Surefire Reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.run_number }}
          path: ${{ env.PROJECT_NAME }}/target/surefire-reports
          retention-days: 7

      - name: Check API coverage threshold
        id: check-coverage
        run: |
          COVERAGE_FILE="swagger-coverage-results.json"
          THRESHOLD=50

          if [ ! -f "$COVERAGE_FILE" ]; then
            echo "❌ ERROR: Coverage file not found at $COVERAGE_FILE"
            exit 1
          fi

          # Получаем данные о покрытии
          TOTAL_ENDPOINTS=$(jq '.coverageOperationMap.counter.all' "$COVERAGE_FILE")
          FULL=$(jq '.coverageOperationMap.counter.full' "$COVERAGE_FILE")
          PARTY=$(jq '.coverageOperationMap.counter.party' "$COVERAGE_FILE")
          EMPTY=$(jq '.coverageOperationMap.counter.empty' "$COVERAGE_FILE")

          # Вычисляем процент покрытия: (full + party) / total * 100
          COVERAGE=$(( (FULL + PARTY) * 100 / TOTAL_ENDPOINTS ))

          echo "=========================================="
          echo "📊 API Coverage Report"
          echo "=========================================="
          echo "Total endpoints: $TOTAL_ENDPOINTS"
          echo "✅ Fully covered: $FULL"
          echo "⚠️  Partially covered: $PARTY"
          echo "❌ Uncovered: $EMPTY"
          echo "------------------------------------------"
          echo "🎯 Coverage: ${COVERAGE}%"
          echo "🎯 Threshold: ${THRESHOLD}%"
          echo "=========================================="

          # Сохраняем результат для badge
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT

          # Проверка порога
          if [ "$COVERAGE" -lt "$THRESHOLD" ]; then
            echo ""
            echo "❌ QUALITY GATE FAILED!"
            echo "   Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"

            # Показываем непокрытые эндпоинты
            echo ""
            echo "📋 Uncovered endpoints (EMPTY):"
            jq -r '.coverageOperationMap.empty[] | "   - \(.httpMethod) \(.path)"' "$COVERAGE_FILE" 2>/dev/null || echo "   None"

            echo ""
            echo "📋 Partially covered endpoints (PARTY):"
            jq -r '.coverageOperationMap.party[] | "   - \(.httpMethod) \(.path)"' "$COVERAGE_FILE" 2>/dev/null || echo "   None"

            exit 1
          else
            echo ""
            echo "✅ QUALITY GATE PASSED!"
            echo "   Coverage ${COVERAGE}% meets threshold ${THRESHOLD}%"
            exit 0
          fi

      - name: Upload swagger coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swagger-coverage-data
          path: swagger-coverage-output/
          retention-days: 7

      - name: Get previous Allure report history
        uses: actions/checkout@v6.0.2
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

       # 2. Генерируем HTML-отчёт из результатов тестов (папка target/allure-results)
      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@v1.13
        if: always()
        with:
          gh_pages: gh-pages
          allure_history: allure-history
          allure_results: target/allure-results

      - name: Generate swagger coverage report
        if: always()
        run:  sudo cp swagger-coverage-report.html allure-history/${{ github.run_number }}

      # 3. Публикуем сгенерированный отчёт в ветку gh-pages
      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Build Docker image and push to docker hub
        if: success()
        run: |
          echo "Building Docker image..."
          
          docker build -t nbank_tests:latest .
          echo "✅ Docker image built successfully"
          
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_LOGIN }}" --password-stdin
          COMMIT_HASH=$(git rev-parse --short HEAD)
          docker tag nbank_tests:latest ${{ secrets.DOCKERHUB_LOGIN }}/nbank_tests_repo:$COMMIT_HASH
          docker push ${{ secrets.DOCKERHUB_LOGIN }}/nbank_tests_repo:$COMMIT_HASH
          
          docker logout
          echo "✅ Docker image pushed successfully to Docker Hub"
