name: Run tests

#trigger
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'src/**'
  workflow_dispatch:

jobs:
  run-tests:
    name: Setup services (review apps) and run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository # copy repossitory files into agent runner
        uses: actions/checkout@v6.0.2

      - name: Setup JDK
        uses: actions/setup-java@v5.2.0
        with:
          distribution: "corretto"
          java-version: "21"

      - name: Setup Maven 3.9.11
        uses: stCarolas/setup-maven@v5.1
        with:
          maven-version: 3.9.11

      - name: Install jq
        if: always()
        run: sudo apt-get install -y jq

      - name: Cache maven repo
        uses: actions/cache@v5.0.5
        with:
          path: ~/m2/repository
          key: ${{runner.os}}-maven-${{hashFiles('**.pom.xml')}}
          restore-keys: |
            ${{runner.os}}-maven-

      - name: Setup services
        run: |
          pwd
          cd ./infra/docker_compose
          chmod +x ./restart_docker_compose.sh
          ./restart_docker_compose.sh

      - name: Check nginx
        run: |
          echo "=== Check running containers ==="
          docker ps

          echo "=== Check nginx logs ==="
          docker logs docker_compose-nginx-1 --tail 50

          echo "=== Test nginx directly ==="
          curl -v http://localhost:80
          curl -v http://localhost:80/api/v1/  # если есть API endpoint

          echo "=== Check nginx config ==="
          docker exec docker_compose-nginx-1 cat /etc/nginx/nginx.conf

          echo "=== Check that frontend is reachable from nginx ==="
          docker exec docker_compose-nginx-1 curl -v http://frontend:3000 || echo "Cannot reach frontend"
          docker exec docker_compose-nginx-1 curl -v http://backend:4111 || echo "Cannot reach backend"
      - name: Debug Selenoid after startup
        run: |
          echo "=== Selenoid status API ==="
          curl -s http://localhost:4444/status | jq '.' || curl -s http://localhost:4444/status
    
          echo -e "\n=== Selenoid logs ==="
          docker logs docker_compose-selenoid-1 --tail 50
    
          echo -e "\n=== Check if browsers.json is mounted correctly ==="
          docker exec docker_compose-selenoid-1 ls -la /etc/selenoid/
          docker exec docker_compose-selenoid-1 cat /etc/selenoid/browsers.json 2>/dev/null || echo "browsers.json not found"
    
          echo -e "\n=== Check available browser versions ==="
          curl -s http://localhost:4444/status | grep -o '"chrome":{[^}]*}' || echo "Chrome not found in status"

      - name: Run Api tests
        run: mvn clean test -q -P api
        env:
          BASE_API_URL: "http://localhost:4111"

      - name: Run UI tests
        run: mvn test -q -P ui -DskipCheckstyle=true
        env:
          BASE_UI_URL: "http://nginx:80"
          BASE_API_URL: "http://localhost:4111"
          REMOTE: "http://localhost:4444/wd/hub"

      - name: Run swagger coverage
        if: always()
        run: |
          mkdir -p swagger-coverage-output
          .swagger-coverage-commandline/bin/swagger-coverage-commandline \
            -s http://localhost:4111/v3/api-docs \
            -i swagger-coverage-output

          # Копируем результат в ожидаемое место
          if [ -f "swagger-coverage-results.json" ]; then
            cp swagger-coverage-results.json swagger-coverage-output/coverage.json
          fi

      - name: Get coverage value
        id: get-coverage
        if: always()
        run: |
          COVERAGE=$(jq -r '.coverage // 0' swagger-coverage-output/coverage.json)
          COVERAGE=$(printf "%.0f" "$COVERAGE")
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "API Coverage: $COVERAGE%"

      - name: Upload swagger coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swagger-coverage-data
          path: swagger-coverage-output/
          retention-days: 7

      - name: Get previous Allure report history
        uses: actions/checkout@v6.0.2
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

       # 2. Генерируем HTML-отчёт из результатов тестов (папка target/allure-results)
      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@v1.13
        if: always()
        with:
          gh_pages: gh-pages
          allure_history: allure-history
          allure_results: target/allure-results

      - name: Generate swagger coverage report
        if: always()
        run:  sudo cp swagger-coverage-report.html allure-history/${{ github.run_number }}

      # 3. Публикуем сгенерированный отчёт в ветку gh-pages
      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Build Docker image and push to docker hub
        if: success()
        run: |
          echo "Building Docker image..."
          
          docker build -t nbank_tests:latest .
          echo "✅ Docker image built successfully"
          
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_LOGIN }}" --password-stdin
          COMMIT_HASH=$(git rev-parse --short HEAD)
          docker tag nbank_tests:latest ${{ secrets.DOCKERHUB_LOGIN }}/nbank_tests_repo:$COMMIT_HASH
          docker push ${{ secrets.DOCKERHUB_LOGIN }}/nbank_tests_repo:$COMMIT_HASH
          
          docker logout
          echo "✅ Docker image pushed successfully to Docker Hub"

  quality-gate:
    name: API Coverage Quality Gate
    needs: run-tests  # Важно! Этот job зависит от run-tests
    runs-on: ubuntu-latest
    if: always()  # Запускается даже если предыдущий job failed (чтобы всегда видеть coverage)

    steps:
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: swagger-coverage-data
          path: ./coverage-report

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Check coverage threshold
        id: check-coverage
        run: |
          COVERAGE_FILE="./coverage-report/swagger-coverage-output/coverage.json"
          THRESHOLD=50

          echo "=== API Coverage Quality Gate ==="
          echo "Threshold: ${THRESHOLD}%"

          if [ ! -f "$COVERAGE_FILE" ]; then
            echo "❌ ERROR: Coverage file not found!"
            echo "Looking for: $COVERAGE_FILE"
            echo "Available files:"
            ls -la ./coverage-report/ || echo "No coverage report found"
            exit 1
          fi

          COVERAGE=$(jq -r '.coverage // 0' "$COVERAGE_FILE")
          COVERAGE=$(printf "%.0f" "$COVERAGE")

          echo "Current API Coverage: ${COVERAGE}%"

          # Детальный отчет
          echo ""
          echo "📊 Endpoint Coverage Summary:"
          TOTAL_ENDPOINTS=$(jq '.endpoints | length' "$COVERAGE_FILE")
          COVERED_ENDPOINTS=$(jq '[.endpoints[] | select(.coverage >= 100)] | length' "$COVERAGE_FILE")
          PARTIAL_ENDPOINTS=$(jq '[.endpoints[] | select(.coverage > 0 and .coverage < 100)] | length' "$COVERAGE_FILE")
          UNCOVERED_ENDPOINTS=$(jq '[.endpoints[] | select(.coverage == 0)] | length' "$COVERAGE_FILE")

          echo "   Total endpoints: $TOTAL_ENDPOINTS"
          echo "   ✅ Fully covered: $COVERED_ENDPOINTS"
          echo "   ⚠️  Partial coverage: $PARTIAL_ENDPOINTS"
          echo "   ❌ Uncovered: $UNCOVERED_ENDPOINTS"

          if [ $UNCOVERED_ENDPOINTS -gt 0 ]; then
            echo ""
            echo "⚠️  Uncovered endpoints:"
            jq -r '.endpoints[] | select(.coverage == 0) | "   - \(.method) \(.path)"' "$COVERAGE_FILE" | head -10
          fi

          # Сохраняем результат для badge
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT

          # Проверка порога
          echo ""
          if [ "$COVERAGE" -lt "$THRESHOLD" ]; then
            echo "❌ QUALITY GATE FAILED!"
            echo "   Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          else
            echo "✅ QUALITY GATE PASSED!"
            echo "   Coverage ${COVERAGE}% meets threshold ${THRESHOLD}%"
          fi

      - name: Create coverage badge
        if: success()
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ secrets.GIST_ID }}
          filename: api-coverage.json
          label: "API Coverage"
          message: "${{ steps.check-coverage.outputs.coverage }}%"
          color: "${{ steps.check-coverage.outputs.coverage >= 50 && 'green' || 'red' }}"