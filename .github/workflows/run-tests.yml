name: Run tests

#trigger
on: [ push, workflow_dispatch ]

jobs:
  run-tests:
    name: Setup services (review apps) and run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository # copy repossitory files into agent runner
        uses: actions/checkout@v6.0.2

      - name: Setup JDK
        uses: actions/setup-java@v5.2.0
        with:
          distribution: "corretto"
          java-version: "21"

      - name: Setup Maven 3.9.11
        uses: stCarolas/setup-maven@v5.1
        with:
          maven-version: 3.9.11

      - name: Cache maven repo
        uses: actions/cache@v5.0.5
        with:
          path: ~/m2/repository
          key: ${{runner.os}}-maven-${{hashFiles('**.pom.xml')}}
          restore-keys: |
            ${{runner.os}}-maven-

      - name: Setup services
        run: |
          pwd
          cd ./infra/docker_compose
          ls
          chmod +x ./restart_docker_compose.sh
          ./restart_docker_compose.sh

      - name: Check nginx
        run: |
          echo "=== Check running containers ==="
          docker ps

          echo "=== Check nginx logs ==="
          docker logs docker_compose-nginx-1 --tail 50

          echo "=== Test nginx directly ==="
          curl -v http://localhost:80
          curl -v http://localhost:80/api/v1/  # если есть API endpoint

          echo "=== Check nginx config ==="
          docker exec docker_compose-nginx-1 cat /etc/nginx/nginx.conf

          echo "=== Check that frontend is reachable from nginx ==="
          docker exec docker_compose-nginx-1 curl -v http://frontend:3000 || echo "Cannot reach frontend"
          docker exec docker_compose-nginx-1 curl -v http://backend:4111 || echo "Cannot reach backend"

      - name: Check network connectivity
        run: |
          echo "=== Check Docker network ==="
          docker network ls
          docker network inspect nbank-network
    
          echo "=== Test connectivity from Selenoid to nginx ==="
          docker exec docker_compose-selenoid-1 curl -v http://docker_compose-nginx-1:80 || echo "Cannot reach nginx from selenoid"
          docker exec docker_compose-selenoid-1 curl -v http://nginx:80 || echo "Cannot reach nginx by service name"
    
          echo "=== Test connectivity from Selenoid to host ==="
          docker exec docker_compose-selenoid-1 curl -v http://host.docker.internal:80 || echo "host.docker.internal not available"
          docker exec docker_compose-selenoid-1 curl -v http://172.17.0.1:80 || echo "Gateway IP not available"

      - name: Debug container internals
        run: |
          echo "=== Check what's running inside backend container ==="
          docker exec docker_compose-backend-1 ps aux
          docker exec docker_compose-backend-1 netstat -tulpn 2>/dev/null || echo "netstat not available"
    
          echo "=== Test backend inside container ==="
          docker exec docker_compose-backend-1 wget -qO- http://localhost:4111 2>&1 || echo "Cannot connect to backend inside container"
    
          echo "=== Check what's running inside frontend container ==="
          docker exec docker_compose-frontend-1 ps aux
          docker exec docker_compose-frontend-1 netstat -tulpn 2>/dev/null || echo "netstat not available"
    
          echo "=== Test frontend inside container ==="
          docker exec docker_compose-frontend-1 wget -qO- http://localhost:3000 2>&1 || echo "Cannot connect to frontend inside container"

      - name: Run Api tests
        run: mvn clean test -q -P api
        env:
          BASE_API_URL: "http://localhost:4111"
          REMOTE: "http://localhost:4444/wd/hub"

      - name: Run UI tests
        run: mvn clean test -q -P ui
        env:
          BASE_UI_URL: "http://localhost:80"
          BASE_API_URL: "http://localhost:4111"
          REMOTE: "http://localhost:4444/wd/hub"